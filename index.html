<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>認識四邊形的特性 ｜ 互動教學網頁</title>
<style>
:root{--c1:#2b6cb0;--bg:#f2f6fb;--ok:#2f855a;--bad:#c53030}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:#222;font-size:18px;line-height:1.55}
header{background:linear-gradient(90deg,#2b6cb0,#4299e1);color:#fff;padding:14px 22px;position:relative}
header h1{margin:0;font-size:26px}header p{margin:4px 0 0;font-size:15px;opacity:.92}
.credit{position:absolute;right:22px;top:14px;font-size:15px;background:rgba(255,255,255,.22);padding:4px 12px;border-radius:999px}
@media(max-width:760px){.credit{position:static;display:inline-block;margin-top:6px}}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;background:#fff;border-bottom:2px solid #dde3ea;position:sticky;top:0;z-index:20}
nav button{border:2px solid #cbd5e0;background:#fff;border-radius:20px;padding:6px 14px;font-size:16px;cursor:pointer}
nav button.active{background:var(--c1);color:#fff;border-color:var(--c1)}
main{max-width:1120px;margin:0 auto;padding:14px}
section.tab{display:none}section.tab.active{display:block}
h2{margin:8px 0 4px;font-size:28px}h3{margin:0 0 8px;font-size:21px;color:#2a4365}
.card{background:#fff;border-radius:14px;padding:16px 20px;margin:14px 0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:800px){.grid2,.grid3{grid-template-columns:1fr}}
.tip{color:#555;font-size:16px;margin:6px 0}
.btn{background:var(--c1);color:#fff;border:0;border-radius:10px;padding:9px 18px;font-size:17px;cursor:pointer;margin:4px}
.btn.ghost{background:#fff;color:var(--c1);border:2px solid var(--c1)}.btn.ok{background:var(--ok)}.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.btns .btn.ghost.active{background:var(--c1);color:#fff}
.props li{font-size:19px;margin:4px 0}
.choices{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.choice{font-size:20px;padding:10px 22px;border-radius:12px;border:2px solid #cbd5e0;background:#fff;cursor:pointer}
.choice.right{background:#c6f6d5;border-color:var(--ok)}.choice.wrong{background:#fed7d7;border-color:var(--bad)}
.quiz-head{font-weight:bold;color:#2a4365;margin-bottom:6px}.quiz-body{text-align:center}
.feedback .ok{background:#f0fff4;border-left:6px solid var(--ok);padding:8px 12px;border-radius:8px;margin-top:10px}
.feedback .bad{background:#fff5f5;border-left:6px solid var(--bad);padding:8px 12px;border-radius:8px;margin-top:10px}
.warn{color:#b7791f;font-weight:bold}.done{font-size:24px;padding:20px;color:#2a4365}
.fill-row{margin:8px 0;font-size:19px}.fill-row select{font-size:18px;padding:4px 8px;margin:0 4px;border-radius:8px;border:2px solid #cbd5e0}
.fill-row select.bad{border-color:var(--bad)}.mark{margin-left:8px}
.fv{text-align:center}.fv .cap{min-height:28px;color:#2a4365;font-weight:bold}
.pegboard{width:100%;max-width:400px;background:#fff8e1;border:3px solid #b7791f;border-radius:12px;touch-action:manipulation;cursor:pointer;display:block}
.peg-wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}.peg-msg{font-size:18px;min-height:30px;flex:1 1 260px}
.slider{width:260px}
.squash{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.squash-svg{width:100%;max-width:440px;background:#f7fafc;border-radius:12px}
.squash-txt{flex:1 1 260px;font-size:18px}.squash-txt b{color:#c53030}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.subtabs button{border:2px solid #cbd5e0;background:#fff;border-radius:10px;padding:6px 12px;font-size:16px;cursor:pointer}
.subtabs button.active{background:#ed8936;color:#fff;border-color:#ed8936}
.subpanel{display:none}.subpanel.active{display:block}
.tangram-svg{width:100%;max-width:760px;background:#f7fafc;border:2px solid #cbd5e0;border-radius:12px;touch-action:none;user-select:none;display:block}
.tangram-svg polygon.piece{cursor:grab;stroke:#2d3748;stroke-width:.06}.tangram-svg polygon.piece.sel{stroke:#000;stroke-width:.12;filter:drop-shadow(0 0 .1px #000)}
.life-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.life-item{background:#fafafa;border:1px solid #e2e8f0;border-radius:10px;padding:8px;text-align:center}
.life-item svg{width:100%;height:auto}.life-item .nm{font-weight:bold}.life-item .why{font-size:15px;color:#444}
.shape-card{cursor:pointer;text-align:center;border:2px solid #e2e8f0;border-radius:12px;padding:8px;background:#fff}
.shape-card:hover{border-color:var(--c1)}
.timeline{display:flex;flex-wrap:wrap;gap:8px}.timeline button{border:2px solid #b7791f;background:#fffaf0;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:16px}
.timeline button.active{background:#b7791f;color:#fff}.tl-text{margin-top:10px;background:#fffaf0;border-radius:10px;padding:12px;min-height:60px;font-size:18px}
.flip{perspective:800px;cursor:pointer;height:150px}.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}.flip .f,.flip .b{position:absolute;inset:0;border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:center;text-align:center;backface-visibility:hidden}
.flip .f{background:#ebf8ff;font-size:22px;font-weight:bold}.flip .b{background:#fefcbf;transform:rotateY(180deg);font-size:16px}
.kite-fly{animation:fly 4s ease-in-out infinite;transform-origin:150px 105px}
@keyframes fly{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-20px,-25px) rotate(-8deg)}50%{transform:translate(10px,-45px) rotate(5deg)}75%{transform:translate(25px,-20px) rotate(8deg)}100%{transform:translate(0,0) rotate(0)}}
table.cmp{border-collapse:collapse;width:100%}table.cmp td,table.cmp th{border:1px solid #cbd5e0;padding:6px;text-align:center;font-size:16px}
table.cmp td.good{background:#c6f6d5}table.cmp td.wrong{background:#fed7d7}table.cmp input{width:22px;height:22px}
.video-box input{font-size:16px;padding:8px;width:min(420px,100%);border-radius:8px;border:2px solid #cbd5e0}
.video-frame iframe{width:100%;max-width:720px;aspect-ratio:16/9;border:0;border-radius:12px}
.banner{width:100%;max-width:900px;display:block;margin:auto}
.badge{display:inline-block;background:#fefcbf;border-radius:8px;padding:2px 8px;font-size:15px;margin-left:6px}

/* ===== 預習四頁：對邊／對角／對角線／鄰邊 ===== */
.pv-key{background:#fff8e1;border-left:6px solid #ed8936;padding:10px 14px;border-radius:8px;margin:10px 0;font-size:19px}
.pv-fig{width:100%;max-width:380px;height:auto;display:block;margin:8px auto;touch-action:manipulation;user-select:none}
.pv-demo{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:8px}
.pv-demo .pv-fig{flex:1 1 280px}
.pv-note{flex:1 1 220px;min-height:70px;background:#ebf8ff;border-radius:8px;padding:10px 14px;font-size:18px}
.pv-side{stroke:#333;stroke-width:4;stroke-linecap:round}
.pv-side.hl{stroke:#e53e3e;stroke-width:9}.pv-side.hl2{stroke:#2f855a;stroke-width:9}.pv-side.sel{stroke:#2b6cb0;stroke-width:9}
.pv-hit{stroke:transparent;stroke-width:30;fill:none;cursor:pointer;pointer-events:stroke}
.pv-ang{fill:#ffd54f;opacity:.6;cursor:pointer;stroke:#c99700;stroke-width:1}
.pv-ang.hl{fill:#e53e3e;opacity:.9}.pv-ang.hl2{fill:#2f855a;opacity:.9}.pv-ang.sel{fill:#2b6cb0;opacity:.9}
.pv-vtx{fill:#fff;stroke:#333;stroke-width:3;cursor:pointer}
.pv-vtx.hl{fill:#e53e3e}.pv-vtx.hl2{fill:#2f855a}.pv-vtx.sel{fill:#2b6cb0}
.pv-lbl{font-size:22px;font-weight:700;pointer-events:none}
.pv-diag{stroke:#805ad5;stroke-width:4;stroke-dasharray:8 6}.pv-diag.user{stroke:#2b6cb0;stroke-dasharray:none;stroke-width:5}
.pv-qhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.pv-qtext{font-size:20px;font-weight:700;margin:8px 0}
.pv-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:8px}
.pv-opt{padding:12px;font-size:18px;border:2px solid #cbd5e0;background:#fff;border-radius:10px;cursor:pointer}
.pv-opt.correct{background:#c6f6d5;border-color:var(--ok)}.pv-opt.wrong{background:#fed7d7;border-color:var(--bad)}
.pv-fb{margin-top:10px;padding:10px 14px;border-radius:8px;font-weight:700;min-height:1.4em}
.pv-fb.ok{background:#f0fff4;border-left:6px solid var(--ok);color:#22543d}.pv-fb.no{background:#fff5f5;border-left:6px solid var(--bad);color:#9b2c2c}
.pv-progress{height:10px;background:#e1e8f2;border-radius:5px;overflow:hidden;margin:8px 0}.pv-progress div{height:100%;background:var(--ok);transition:width .3s}
.pv-pill{background:#ebf8ff;border-radius:999px;padding:2px 12px;font-weight:700;color:#2b6cb0}
.pv-bg{display:inline-block;padding:0 8px;border-radius:6px;color:#fff;font-weight:700}
.pv-r{color:#e53e3e;font-weight:700}.pv-g{color:#2f855a;font-weight:700}.pv-p{color:#805ad5;font-weight:700}

/* ===== 組與條 ===== */
.gc-big{font-size:21px;text-align:center;background:#fffaf0;border:3px dashed #ed8936;border-radius:12px;padding:12px;margin:10px 0;line-height:1.8}
.gc-big b{color:#c05621}
.gc-cnt{font-size:21px;font-weight:bold;color:#2a4365;min-height:34px;text-align:center;margin:6px 0}
.gc-fig{width:100%;max-width:340px;display:block;margin:auto;user-select:none}
.gc-side{stroke:#4a5568;stroke-width:5;stroke-linecap:round}
.gc-hit{stroke:transparent;stroke-width:28;fill:none;cursor:pointer;pointer-events:stroke}
.gc-bar .btn.ghost.active{background:var(--c1);color:#fff}
.gc-tbl{border-collapse:collapse;width:100%;font-size:17px}.gc-tbl td,.gc-tbl th{border:1px solid #cbd5e0;padding:6px 8px;text-align:center}
.gc-tbl th{background:#ebf8ff}.gc-tbl td.u{font-weight:bold;font-size:20px}

/* ===== 方格紙／比較頁／窗櫺 ===== */
.gridpaper{width:100%;max-width:400px;background:#fff;border:3px solid #4a5568;border-radius:8px;touch-action:manipulation;cursor:pointer;display:block}
.sort-wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}@media(max-width:800px){.sort-wrap{grid-template-columns:1fr}}
.sort-bin{min-height:110px;border:3px dashed #cbd5e0;border-radius:12px;padding:8px;cursor:pointer}
.sort-bin h4{margin:0 0 6px;text-align:center;font-size:17px}
.sort-card{display:block;width:100%;margin:4px 0;padding:8px;border-radius:8px;border:2px solid #cbd5e0;background:#fff;font-size:17px;cursor:pointer;text-align:left}
.sort-card.sel{border-color:var(--c1);background:#ebf8ff}.sort-card.good{background:#c6f6d5;border-color:var(--ok)}.sort-card.badc{background:#fed7d7;border-color:var(--bad)}
.paint-card{cursor:pointer;display:inline-block;margin:6px;border:3px solid transparent;border-radius:12px;padding:4px}
.cells{display:grid;grid-template-columns:repeat(5,44px);gap:3px;justify-content:center;margin:8px 0}.cells div{width:44px;height:44px;background:#edf2f7;border:1px solid #cbd5e0;cursor:pointer;border-radius:4px}.cells div.on{background:#f6ad55;border-color:#9a3412}
.lat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.lat-item{background:#fffaf0;border:1px solid #e2cfa5;border-radius:10px;padding:8px;text-align:center}
.lat-item svg{width:100%;height:auto}
.win-svg{width:100%;display:block;margin:auto}
</style>
</head>
<body>
<header>
 <h1>認識四邊形的特性 <span style="font-size:16px;opacity:.9">數學科・圖形與空間・平面圖形</span></h1>
 <p>互動教學網頁｜正方形・長方形・平行四邊形・梯形・菱形・鷂形｜釘板・七巧板・方格紙・生活中的四邊形・窗櫺・風箏與非遺</p>
 <div class="credit">網頁製作：關麗瑩老師</div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<script>
/* ================= 基本工具 ================= */
const NS='http://www.w3.org/2000/svg';
/* 安全讀寫 localStorage：在被封鎖（如沙盒預覽、私隱模式）時不會拋錯 */
const store={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};
const el=(tag,attrs={},html='')=>{const e=document.createElement(tag);for(const k in attrs){k==='class'?e.className=attrs[k]:e.setAttribute(k,attrs[k]);}if(html)e.innerHTML=html;return e;};
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rot=(pts,deg)=>{const r=deg*Math.PI/180,c=Math.cos(r),s=Math.sin(r);return pts.map(([x,y])=>[x*c-y*s,x*s+y*c]);};
const ptsStr=pts=>pts.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ');
const centroid=P=>[P.reduce((s,p)=>s+p[0],0)/P.length,P.reduce((s,p)=>s+p[1],0)/P.length];
function svgShape(pts,color,size=180,extra='',pad=0.55){const h=size/2;const r=Math.max(...pts.map(p=>Math.hypot(p[0],p[1])))/pad;return `<svg viewBox="${-r} ${-r} ${2*r} ${2*r}" width="${size}" height="${size}"><polygon points="${ptsStr(pts)}" fill="${color}" fill-opacity=".3" stroke="${color}" stroke-width="${r/30}" stroke-linejoin="round"/>${extra}</svg>`;}
function pip(pt,P){let ins=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const [xi,yi]=P[i],[xj,yj]=P[j];if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))ins=!ins;}return ins;}

const TYPES={
 square:{name:'正方形',color:'#e53e3e',desc:'4 條邊長度相等，4 個角都是直角'},
 rect:{name:'長方形',color:'#d69e2e',desc:'2 組對邊長度相等，4 個角都是直角，但 4 條邊不是全部相等'},
 para:{name:'平行四邊形',color:'#3182ce',desc:'2 組對邊平行而且相等，2 組對角相等，但角不是直角'},
 trap:{name:'梯形',color:'#38a169',desc:'只有 1 組對邊平行，而且這組平行的邊長度不同'},
 rhombus:{name:'菱形',color:'#dd6b20',desc:'4 條邊長度相等，2 組對邊平行，2 組對角相等，但角不是直角'},
 kite:{name:'鷂形',color:'#805ad5',desc:'2 組鄰邊長度相等，只有 1 組對角相等'},
 general:{name:'一般四邊形',color:'#718096',desc:'沒有平行的對邊，鄰邊和對邊都不相等'},
 concave:{name:'凹四邊形',color:'#718096',desc:'有一個角向內凹，不是我們學過的六種四邊形'},
 triangle:{name:'三角形',color:'#718096',desc:'只有 3 條邊，不是四邊形'},
 pentagon:{name:'五邊形',color:'#718096',desc:'有 5 條邊，不是四邊形'},
 degenerate:{name:'不是四邊形',color:'#718096',desc:'有三個頂點在同一直線上'}
};
const ORDER=['square','rect','para','trap','rhombus','kite'];
const N4=['1','2','3','4'],ANG=['直','銳','鈍'],YN=['是','不是'],SAME=['相同','不同'];
const SHAPES={
 square:{example:[[-65,-65],[65,-65],[65,65],[-65,65]],props:['4 條邊長度相等','4 個角相等，都是直角','2 組對邊平行'],negs:['rect','rhombus','para','kite','trap','general'],
  fill:[{t:'正方形有 [] 條邊的長度相等。',o:[N4],a:['4']},{t:'正方形有 [] 個角相等，都是 [] 角。',o:[N4,ANG],a:['4','直']},{t:'正方形有 [] 組對邊平行。',o:[N4],a:['2']}],
  intro:'觀察方格紙上的正方形：它的對邊……？它的角……？'},
 rect:{example:[[-85,-45],[85,-45],[85,45],[-85,45]],props:['2 組對邊長度相等','2 組對邊平行','4 個角相等，都是直角'],negs:['square','para','trap','rhombus','kite','general'],
  fill:[{t:'長方形有 [] 組對邊的長度相等。',o:[N4],a:['2']},{t:'長方形有 [] 個角相等，都是 [] 角。',o:[N4,ANG],a:['4','直']},{t:'長方形有 [] 組對邊平行。',o:[N4],a:['2']}],
  intro:'長方形有長邊和短邊，把它和正方形比一比，有甚麼相同和不同？'},
 para:{example:[[-50,-45],[90,-45],[50,45],[-90,45]],props:['2 組對邊長度相等','2 組對邊平行','2 組對角相等'],negs:['rect','trap','rhombus','kite','general','square'],
  fill:[{t:'平行四邊形有 [] 組對邊相等。',o:[N4],a:['2']},{t:'平行四邊形有 [] 組對角相等。',o:[N4],a:['2']},{t:'平行四邊形有 [] 組對邊平行。',o:[N4],a:['2']},{t:'平行四邊形的角 [] 直角。',o:[YN],a:['不是']}],
  intro:'用 4 枝飲管拼出一個長方形，再把它按扁，就變成平行四邊形。'},
 trap:{example:[[-40,-45],[45,-45],[85,45],[-85,45]],props:['只有 1 組對邊平行','平行的對邊長度不相同'],negs:['para','general','kite','rect','rhombus','concave'],
  fill:[{t:'梯形只有 [] 組對邊平行。',o:[N4],a:['1']},{t:'梯形平行的對邊長度 []。',o:[SAME],a:['不同']}],
  intro:'小明用了四條長度不同的紙條做了一個四邊形，像不像一把梯子？'},
 rhombus:{example:[[0,-42],[80,0],[0,42],[-80,0]],props:['4 條邊長度相等','2 組對邊平行','2 組對角相等'],negs:['square','kite','para','general','trap','rect'],
  fill:[{t:'菱形有 [] 條邊長度相等。',o:[N4],a:['4']},{t:'菱形有 [] 組對邊平行。',o:[N4],a:['2']},{t:'菱形有 [] 組對角相等。',o:[N4],a:['2']},{t:'菱形的角 [] 直角。',o:[YN],a:['不是']}],
  intro:'用 4 枝一樣長的飲管拼出正方形，再把它壓扁，四邊長度仍然相等，就變成菱形。'},
 kite:{example:[[0,-75],[55,-15],[0,80],[-55,-15]],props:['2 組鄰邊長度相等','只有 1 組對角相等'],negs:['rhombus','general','trap','para','concave','square'],
  fill:[{t:'鷂形有 [] 組鄰邊長度相等。',o:[N4],a:['2']},{t:'鷂形有 [] 組對角相等。',o:[N4],a:['1']}],
  intro:'用兩組長度一樣的幾何條，可以拼出鷂形，就像一隻紙鷂。'}
};

/* ================= 隨機圖形 ================= */
function genShape(type,rotate=true){
 let p;
 switch(type){
  case 'square':{const s=rnd(35,58);p=[[-s,-s],[s,-s],[s,s],[-s,s]];break;}
  case 'rect':{const w=rnd(55,75),h=rnd(22,38);p=[[-w,-h],[w,-h],[w,h],[-w,h]];break;}
  case 'para':{const w=rnd(38,55),h=rnd(24,38),k=rnd(18,32);p=[[-w+k,-h],[w+k,-h],[w-k,h],[-w-k,h]];break;}
  case 'rhombus':{const dx=rnd(58,75),dy=rnd(28,40);p=[[0,-dy],[dx,0],[0,dy],[-dx,0]];break;}
  case 'trap':{const t=rnd(18,36),b=rnd(52,70),h=rnd(26,40),o=rnd(-16,16);p=[[-t+o,-h],[t+o,-h],[b,h],[-b,h]];break;}
  case 'kite':{const a=rnd(28,42),b=rnd(34,50),c=rnd(60,78);p=[[0,-a],[b,0],[0,c],[-b,0]];break;}

/* ================= 特性觀察器（對邊/對角/對角線/鄰邊） ================= */
function angleArc(p,prev,next,r,color){const u=a=>{const d=[a[0]-p[0],a[1]-p[1]],l=Math.hypot(d[0],d[1]);return [d[0]/l,d[1]/l];};const a=u(prev),b=u(next);const s=[p[0]+a[0]*r,p[1]+a[1]*r],e=[p[0]+b[0]*r,p[1]+b[1]*r];const sweep=a[0]*b[1]-a[1]*b[0]>0?1:0;return `<path d="M${s[0]},${s[1]} A${r},${r} 0 0 ${sweep} ${e[0]},${e[1]}" fill="none" stroke="${color}" stroke-width="6"/>`;}
function rightMark(p,prev,next,r){const u=a=>{const d=[a[0]-p[0],a[1]-p[1]],l=Math.hypot(d[0],d[1]);return [d[0]/l*r,d[1]/l*r];};const a=u(prev),b=u(next);return `<polyline points="${p[0]+a[0]},${p[1]+a[1]} ${p[0]+a[0]+b[0]},${p[1]+a[1]+b[1]} ${p[0]+b[0]},${p[1]+b[1]}" fill="none" stroke="#2d3748" stroke-width="3"/>`;}
function isRight(p,prev,next){const a=[prev[0]-p[0],prev[1]-p[1]],b=[next[0]-p[0],next[1]-p[1]];return Math.abs(a[0]*b[0]+a[1]*b[1])<1e-6;}
function featureViewer(container,pts,color,captions){
 const box=el('div'),cap=el('div',{class:'cap'}),btns=el('div',{class:'btns',style:'justify-content:center'});
 const modes=[['none','圖形'],['sides','對邊'],['adj','鄰邊'],['angles','對角'],['diag','對角線']];
 const caps=Object.assign({none:'任何四邊形都有 4 條邊、4 個角。',sides:'相對的 2 條邊叫「對邊」，四邊形有 2 組對邊（紅、藍）。',adj:'相鄰的 2 條邊叫「鄰邊」。',angles:'相對的 2 個角叫「對角」，四邊形有 2 組對角（紅、藍）。',diag:'連結對角的線叫「對角線」，四邊形有 2 條對角線。'},captions||{});
 const seg=(a,b,c)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="8" stroke-linecap="round"/>`;
 function draw(mode){const P=pts;let ex='';
  if(mode==='sides')ex=seg(P[0],P[1],'#e53e3e')+seg(P[2],P[3],'#e53e3e')+seg(P[1],P[2],'#3182ce')+seg(P[3],P[0],'#3182ce');
  if(mode==='adj')ex=seg(P[0],P[1],'#e53e3e')+seg(P[1],P[2],'#e53e3e')+seg(P[2],P[3],'#3182ce')+seg(P[3],P[0],'#3182ce');
  if(mode==='diag')ex=seg(P[0],P[2],'#e53e3e')+seg(P[1],P[3],'#3182ce');
  if(mode==='angles')ex=P.map((p,i)=>angleArc(p,P[(i+3)%4],P[(i+1)%4],22,i%2?'#3182ce':'#e53e3e')).join('');
  if(mode==='none')ex=P.map((p,i)=>isRight(p,P[(i+3)%4],P[(i+1)%4])?rightMark(p,P[(i+3)%4],P[(i+1)%4],16):'').join('');
  box.innerHTML=svgShape(P,color,260,ex);cap.textContent=caps[mode];btns.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.m===mode));}
 modes.forEach(([m,l])=>{const b=el('button',{class:'btn ghost','data-m':m},l);b.onclick=()=>draw(m);btns.append(b);});
 container.append(box,cap,btns);draw('none');

/* ================= 釘板 ================= */
function classifyQuad(raw){
 const [cx,cy]=centroid(raw);const P=raw.slice().sort((a,b)=>Math.atan2(a[1]-cy,a[0]-cx)-Math.atan2(b[1]-cy,b[0]-cx));
 const v=[0,1,2,3].map(i=>[P[(i+1)%4][0]-P[i][0],P[(i+1)%4][1]-P[i][1]]);
 const cross=(a,b)=>a[0]*b[1]-a[1]*b[0],dot=(a,b)=>a[0]*b[0]+a[1]*b[1];
 const cr=[0,1,2,3].map(i=>cross(v[i],v[(i+1)%4]));
 if(cr.some(c=>c===0))return{type:'degenerate',P};
 if(!(cr.every(c=>c>0)||cr.every(c=>c<0)))return{type:'concave',P};
 const L=v.map(a=>dot(a,a));const par02=cross(v[0],v[2])===0,par13=cross(v[1],v[3])===0;const right=dot(v[0],v[1])===0&&dot(v[1],v[2])===0;const allEq=L.every(l=>l===L[0]);
 let type;if(par02&&par13)type=allEq?(right?'square':'rhombus'):(right?'rect':'para');else if(par02||par13)type='trap';else if((L[0]===L[1]&&L[2]===L[3])||(L[1]===L[2]&&L[3]===L[0]))type='kite';else type='general';
 return{type,P};
}
const HINTS={square:'正方形要 4 條邊一樣長，4 個角都是直角。',rect:'長方形要有 4 個直角，並且要有長邊和短邊（不是 4 邊相等）。',para:'平行四邊形要 2 組對邊平行，但角不是直角。',trap:'梯形只有 1 組對邊平行，而且兩條平行的邊長度要不同。',rhombus:'菱形要 4 條邊一樣長，但角不是直角（不可以是正方形），試試把它壓扁一點。',kite:'鷂形要 2 組鄰邊相等，像風箏一樣。'};
class Pegboard{
 constructor(container,{n=9,cell=38,target,given=[],onSuccess}={}){
  this.n=n;this.cell=cell;this.target=target;this.given=given.map(p=>p.slice());this.pts=this.given.slice();this.onSuccess=onSuccess;this.pad=cell;this.W=(n-1)*cell+2*cell;
  const wrap=el('div',{class:'peg-wrap'});this.svg=document.createElementNS(NS,'svg');this.svg.setAttribute('viewBox',`0 0 ${this.W} ${this.W}`);this.svg.setAttribute('class','pegboard');
  const side=el('div',{style:'flex:1 1 240px'});this.msg=el('div',{class:'peg-msg'});const btns=el('div',{class:'btns'});
  const reset=el('button',{class:'btn ghost'},'🔄 重設');reset.onclick=()=>{this.pts=this.given.slice();this.msg.innerHTML='';this.render();};btns.append(reset);
  side.append(btns,this.msg);wrap.append(this.svg,side);container.append(wrap);
  this.svg.addEventListener('click',e=>this.onClick(e));this.render();
 }
 xy([i,j]){return[this.pad+i*this.cell,this.pad+j*this.cell];}
 onClick(e){const r=this.svg.getBoundingClientRect();const k=this.W/r.width;const x=(e.clientX-r.left)*k,y=(e.clientY-r.top)*k;const i=Math.round((x-this.pad)/this.cell),j=Math.round((y-this.pad)/this.cell);
  if(i<0||j<0||i>=this.n||j>=this.n)return;const [px,py]=this.xy([i,j]);if(Math.hypot(px-x,py-y)>this.cell*.45)return;
  const idx=this.pts.findIndex(p=>p[0]===i&&p[1]===j);
  if(idx>=0){if(idx<this.given.length){this.msg.innerHTML='<span class="warn">這是題目給出的頂點，不能移除。</span>';return;}this.pts.splice(idx,1);this.msg.innerHTML='';}
  else{if(this.pts.length>=4){this.msg.innerHTML='<span class="warn">已經有 4 個頂點了。點選頂點可移除，或按「重設」。</span>';return;}this.pts.push([i,j]);this.msg.innerHTML='';}
  this.render();if(this.pts.length===4)this.check();}
 render(){let s='';for(let i=0;i<this.n;i++)for(let j=0;j<this.n;j++){const [x,y]=this.xy([i,j]);s+=`<circle cx="${x}" cy="${y}" r="5" fill="#b7791f"/>`;}
  let P=this.pts;if(P.length===4){P=classifyQuad(P).P;s+=`<polygon points="${ptsStr(P.map(p=>this.xy(p)))}" fill="#3182ce" fill-opacity=".25" stroke="#2b6cb0" stroke-width="5" stroke-linejoin="round"/>`;}
  else if(P.length>1)s+=`<polyline points="${ptsStr(P.map(p=>this.xy(p)))}" fill="none" stroke="#2b6cb0" stroke-width="5" stroke-linecap="round"/>`;
  this.pts.forEach((p,i)=>{const [x,y]=this.xy(p);s+=`<circle cx="${x}" cy="${y}" r="11" fill="${i<this.given.length?'#ecc94b':'#e53e3e'}" stroke="#2d3748" stroke-width="2"/>`;});

 check(){const {type}=classifyQuad(this.pts);const T=TYPES[this.target];
  if(type===this.target){this.msg.innerHTML=`<div class="feedback"><div class="ok">🎉 成功！這是${T.name}：${T.desc}。</div></div>`;if(this.onSuccess)this.onSuccess();}
  else{const got=TYPES[type]||TYPES.general;this.msg.innerHTML=`<div class="feedback"><div class="bad">你畫的是<b>${got.name}</b>（${got.desc}）。<br>提示：${HINTS[this.target]}<br>點選頂點可以移除，再試試！</div></div>`;}}
}

  const wrap=el('div',{class:'peg-wrap'});this.svg=document.createElementNS(NS,'svg');this.svg.setAttribute('viewBox',`0 0 ${this.W} ${this.W}`);this.svg.setAttribute('class','gridpaper');

 xy([i,j]){return[this.pad+i*this.cell,this.pad+j*this.cell];}
 onClick(e){const r=this.svg.getBoundingClientRect();const k=this.W/r.width;const x=(e.clientX-r.left)*k,y=(e.clientY-r.top)*k;const i=Math.round((x-this.pad)/this.cell),j=Math.round((y-this.pad)/this.cell);
  if(i<0||j<0||i>=this.n||j>=this.n)return;const [px,py]=this.xy([i,j]);if(Math.hypot(px-x,py-y)>this.cell*.4)return;
  const idx=this.pts.findIndex(p=>p[0]===i&&p[1]===j);
  if(idx>=0){this.pts.splice(idx,1);this.msg.innerHTML='';}
  else{if(this.pts.length>=4){this.msg.innerHTML='<span class="warn">已經有 4 個頂點了。點選頂點可移除，或按「清除」。</span>';return;}this.pts.push([i,j]);this.msg.innerHTML='';}
  this.render();if(this.pts.length===4)this.check();}

 render(){let s='';const c=(this.n-1)/2;
  for(let i=0;i<this.n;i++){const [x,y]=this.xy([i,i]);s+=`<line x1="${x}" y1="${this.pad}" x2="${x}" y2="${this.W-this.pad}" stroke="#bee3f8" stroke-width="1.5"/><line x1="${this.pad}" y1="${y}" x2="${this.W-this.pad}" y2="${y}" stroke="#bee3f8" stroke-width="1.5"/>`;}

  this.done.forEach(P=>{s+=this.poly(P,`fill="${TYPES[this.target].color}" fill-opacity=".25" stroke="${TYPES[this.target].color}" stroke-width="4"`);});
  let P=this.pts;if(P.length===4){P=classifyQuad(P).P;s+=this.poly(P,'fill="#3182ce" fill-opacity=".25" stroke="#2b6cb0" stroke-width="5" stroke-linejoin="round"');}
  else if(P.length>1)s+=`<polyline points="${ptsStr(P.map(p=>this.xy(p)))}" fill="none" stroke="#2b6cb0" stroke-width="5" stroke-linecap="round"/>`;
  this.pts.forEach(p=>{const [x,y]=this.xy(p);s+=`<circle cx="${x}" cy="${y}" r="9" fill="#e53e3e" stroke="#2d3748" stroke-width="2"/>`;});

function sortActivity(container,bins,items){
 const pool=el('div',{class:'sort-bin'},'<h4>📋 句子</h4>');const wrap=el('div',{class:'sort-wrap'});const binEls={};
 bins.forEach(([k,l,c])=>{const b=el('div',{class:'sort-bin',style:`border-color:${c}`},`<h4 style="color:${c}">${l}</h4>`);b.dataset.k=k;binEls[k]=b;wrap.append(b);});
 let sel=null;const cards=shuffle(items).map(([t,k])=>{const c=el('button',{class:'sort-card'},t);c.dataset.a=k;c.onclick=e=>{e.stopPropagation();cards.forEach(x=>x.classList.remove('sel'));sel=c;c.classList.add('sel');};pool.append(c);return c;});
 const move=target=>{if(!sel)return;target.append(sel);sel.classList.remove('sel','good','badc');sel=null;};
 Object.values(binEls).forEach(b=>b.onclick=()=>move(b));pool.onclick=()=>move(pool);
 const chk=el('button',{class:'btn'},'檢查答案'),res=el('div',{class:'feedback'});
 chk.onclick=()=>{let ok=0,placed=0;cards.forEach(c=>{const inBin=c.parentElement.dataset.k;if(!inBin){c.classList.remove('good','badc');return;}placed++;const g=inBin===c.dataset.a;c.classList.toggle('good',g);c.classList.toggle('badc',!g);if(g)ok++;});
  res.innerHTML=placed<cards.length?`<div class="bad">還有 ${cards.length-placed} 句未放進框內。</div>`:ok===cards.length?'<div class="ok">全部正確！👏</div>':`<div class="bad">答對 ${ok} / ${cards.length}，紅色的句子放錯了，點選它再放到別的框。</div>`;};
 container.append(el('p',{class:'tip'},'👆 先點選一句，再點選要放進的框。放錯了可以再點選移動。'),pool,wrap,chk,res);
}

function fourSquares(container){

  const xs=on.map(p=>p[0]),ys=on.map(p=>p[1]);const w=Math.max(...xs)-Math.min(...xs)+1,h=Math.max(...ys)-Math.min(...ys)+1;const got=w*h!==4?'other':(w===h?'square':'rect');

 container.append(bar,grid,msg);bar.children[0].click();

/* ================= 預習四頁：對邊／對角／對角線／鄰邊 ================= */
const svgEl=(t,a={},txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;};
const PV_NAMES=['A','B','C','D'],PV_SIDES=['AB','BC','CD','DA'];
const PV_SHAPES={
 gen:[[70,70],[290,55],[310,235],[60,250]],
 gen2:[[90,50],[310,80],[280,250],[50,220]],
 rect:[[60,60],[300,60],[300,240],[60,240]],
 para:[[100,60],[320,60],[260,240],[40,240]],
 trap:[[110,60],[250,60],[320,240],[40,240]],
 kite:[[190,45],[310,140],[190,255],[70,140]]
};
const pvSideIdx=k=>PV_SIDES.indexOf(k);
function pvArc(P,u1,u2,r){
 let a1=Math.atan2(u1[1],u1[0]),a2=Math.atan2(u2[1],u2[0]),d=a2-a1;
 while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
 let s=`M${P[0]},${P[1]}`;const n=12;
 for(let i=0;i<=n;i++){const a=a1+d*i/n;s+=` L${(P[0]+r*Math.cos(a)).toFixed(1)},${(P[1]+r*Math.sin(a)).toFixed(1)}`;}
 return s+' Z';
}
function pvDraw(svg,shape,o={}){
 const P=PV_SHAPES[shape];svg.innerHTML='';svg.setAttribute('viewBox','0 0 380 300');
 o.sideCls=o.sideCls||{};o.angCls=o.angCls||{};o.vtxCls=o.vtxCls||{};
 const cx=(P[0][0]+P[1][0]+P[2][0]+P[3][0])/4,cy=(P[0][1]+P[1][1]+P[2][1]+P[3][1])/4;
 svg.appendChild(svgEl('polygon',{points:P.map(p=>p.join(',')).join(' '),fill:'#f7fbff'}));
 if(o.angles){
  const u=(a,b)=>{const dx=a[0]-b[0],dy=a[1]-b[1],l=Math.hypot(dx,dy);return[dx/l,dy/l];};
  P.forEach((p,i)=>{
   const d=svgEl('path',{d:pvArc(p,u(P[(i+3)%4],p),u(P[(i+1)%4],p),o.pick==='angle'?36:26),class:'pv-ang '+(o.angCls[PV_NAMES[i]]||'')});
   if(o.pick==='angle')d.addEventListener('click',()=>o.onPick(PV_NAMES[i]));
   svg.appendChild(d);
  });
 }
 (o.diags||[]).forEach(d=>{const[k,flag]=d.split('|');const a=P[PV_NAMES.indexOf(k[0])],b=P[PV_NAMES.indexOf(k[1])];
  svg.appendChild(svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:'pv-diag'+(flag?' user':'')}));});
 P.forEach((p,i)=>{const q=P[(i+1)%4],k=PV_SIDES[i];
  svg.appendChild(svgEl('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],class:'pv-side '+(o.sideCls[k]||'')}));
  if(o.pick==='side'){const h=svgEl('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],class:'pv-hit'});h.addEventListener('click',()=>o.onPick(k));svg.appendChild(h);}
 });
 P.forEach((p,i)=>{
  const c=svgEl('circle',{cx:p[0],cy:p[1],r:o.pick==='vertex'?14:8,class:'pv-vtx '+(o.vtxCls[PV_NAMES[i]]||'')});
  if(o.pick==='vertex')c.addEventListener('click',()=>o.onPick(PV_NAMES[i]));
  svg.appendChild(c);
  const dx=p[0]-cx,dy=p[1]-cy,l=Math.hypot(dx,dy);
  svg.appendChild(svgEl('text',{x:p[0]+dx/l*28,y:p[1]+dy/l*28+8,'text-anchor':'middle',class:'pv-lbl'},PV_NAMES[i]));
 });
}
function pvDemo(svg,note,kind){
 let st={};
 const draw=()=>pvDraw(svg,'gen',Object.assign({pick:kind==='diag'?'vertex':kind==='angle'?'angle':'side',onPick:choose,angles:kind==='angle'},st));
 function bindBoth(){const b=note.querySelector('.pv-both');if(b)b.onclick=()=>{st={diags:['AC','BD']};

  draw();
 }

function pvQuiz(root,qs){
 let i=0,score=0,tries=0,sel=[],locked=false,reveal=false;
 const kindOf=m=>m.includes('side')?'side':m.includes('angle')?'angle':(m==='vertex'||m==='diag')?'vertex':null;
 function render(){
  if(i>=qs.length){
   const msg=score===qs.length?'太厲害了，全部正確！🎉':score>=qs.length/2?'做得不錯！再看一次做錯的地方吧。👍':'再溫習一次上面的講解，然後重做一次！💪';
   root.innerHTML=`<div class="done">🏁 完成！你的得分：${score} / ${qs.length}</div><div class="pv-fb ok">${msg}</div>`;
   const b=el('button',{class:'btn'},'🔄 重做一次');b.onclick=()=>{i=0;score=0;render();};root.append(b);return;
  }
  const Q=qs[i];tries=0;sel=[];locked=false;reveal=false;
  const multi=Q.mode.startsWith('multi')||Q.mode==='diag',kind=kindOf(Q.mode);
  root.innerHTML=`<div class="pv-qhead"><span class="pv-pill">第 ${i+1} / ${qs.length} 題</span><span class="pv-pill">⭐ ${score}</span></div>
   <div class="pv-progress"><div style="width:${i/qs.length*100}%"></div></div>
   <div class="pv-qtext">${Q.q}</div>${Q.shape?'<svg class="pv-fig"></svg>':''}
   <div class="tip">${Q.tip||''}</div><div class="pv-opts"></div><div class="pv-fb"></div><div class="pv-act" style="margin-top:10px"></div>`;
  const svg=root.querySelector('svg'),fb=root.querySelector('.pv-fb'),act=root.querySelector('.pv-act'),opts=root.querySelector('.pv-opts');
  function draw(){
   if(!svg)return;
   const o={angles:!!Q.angles||Q.mode.includes('angle'),diags:(Q.diags||[]).slice(),sideCls:Object.assign({},Q.markSides||{}),angCls:Object.assign({},Q.markAngles||{}),vtxCls:Object.assign({},Q.markVerts||{}),pick:locked?null:kind,onPick:choose};
   const tgt=kind==='side'?o.sideCls:kind==='angle'?o.angCls:o.vtxCls;
   sel.forEach(k=>tgt[k]='sel');
   if(Q.mode==='diag'&&sel.length===2)o.diags.push(sel.join('')+'|user');
   if(reveal){const a=multi?Q.answer[0]:Q.answer;if(Q.mode==='diag')o.diags.push(a.join('')+'|user');else a.forEach(k=>tgt[k]='hl2');}
   pvDraw(svg,Q.shape,o);
  }
  function next(){const b=el('button',{class:'btn'},i<qs.length-1?'下一題 ▶':'看結果 🏁');b.onclick=()=>{i++;render();};act.appendChild(b);}
  function good(){if(tries===0)score++;locked=true;fb.className='pv-fb ok';fb.innerHTML='✅ 正確！'+(Q.why||'');}
  function bad(){tries++;fb.className='pv-fb no';
   if(tries>=2){locked=true;reveal=true;fb.innerHTML='❌ 正確答案是：'+(Q.ansText||Q.answer)+'。'+(Q.why||'');return true;}
   fb.innerHTML='❌ 不對，再試一次！'+(Q.hint?'<br>提示：'+Q.hint:'');return false;}
  function check(){
   const s=sel.slice().sort().join(',');
   const ok=multi?Q.answer.some(a=>a.slice().sort().join(',')===s):Q.answer.includes(sel[0]);
   act.innerHTML='';
   if(ok){good();draw();next();}else if(bad()){draw();next();}else{sel=[];draw();}
  }
  function choose(k){
   if(locked)return;
   if(multi){const j=sel.indexOf(k);j>=0?sel.splice(j,1):sel.push(k);draw();
    if(Q.mode==='diag'){if(sel.length===2)check();}
    else{act.innerHTML='';if(sel.length){const b=el('button',{class:'btn'},'檢查答案');b.onclick=check;act.appendChild(b);}}
   }else{sel=[k];draw();check();}
  }
  if(Q.mode==='mc'){Q.options.forEach(op=>{const b=el('button',{class:'pv-opt'},op);b.onclick=()=>{
   if(locked)return;
   if(op===Q.answer){b.classList.add('correct');good();next();}
   else{b.classList.add('wrong');b.disabled=true;if(bad()){[...opts.children].find(x=>x.textContent===Q.answer).classList.add('correct');next();}}
  };opts.appendChild(b);});}
  draw();
 }
 render();
}

const GC_COL=['#e53e3e','#3182ce','#38a169','#805ad5'];
const GC_PTS=[[60,60],[300,50],[320,240],[50,250]];
function gcSideLine(P,i,attrs){const a=P[i],b=P[(i+1)%4];return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" ${attrs}/>`;}
function gcSector(P,i,r){const p=P[i],a=P[(i+3)%4],b=P[(i+1)%4];const ua=Math.atan2(a[1]-p[1],a[0]-p[0]),ub=Math.atan2(b[1]-p[1],b[0]-p[0]);let d=ub-ua;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;let s=`M${p[0]},${p[1]}`;for(let k=0;k<=12;k++){const t=ua+d*k/12;s+=` L${(p[0]+r*Math.cos(t)).toFixed(1)},${(p[1]+r*Math.sin(t)).toFixed(1)}`;}return s+'Z';}
function gcCounter(container){
 const P=GC_PTS,C=centroid(P),box=el('div'),cnt=el('div',{class:'gc-cnt'}),bar=el('div',{class:'btns gc-bar',style:'justify-content:center'});let timer=null;
 const MODES=[
  ['數邊（條）',[[0],[1],[2],[3]],'條','邊','共 4 條邊',false],
  ['數對邊（組）',[[0,2],[1,3]],'組','對邊','共 2 組對邊 ＝ 4 條邊',false],
  ['數角（個）',[[0],[1],[2],[3]],'個','角','共 4 個角',true],
  ['數對角（組）',[[0,2],[1,3]],'組','對角','共 2 組對角 ＝ 4 個角',true]];
 function draw(M,k){const [label,steps,unit,name,sum,isAng]=M;const done=steps.slice(0,k);let ex=P.map((p,i)=>gcSideLine(P,i,'class="gc-side"')).join('');
  done.forEach((st,j)=>st.forEach(i=>{ex+=isAng?angleArc(P[i],P[(i+3)%4],P[(i+1)%4],34,GC_COL[j]):gcSideLine(P,i,`stroke="${GC_COL[j]}" stroke-width="12" stroke-linecap="round"`);}));
  done.forEach((st,j)=>st.forEach(i=>{let x,y;if(isAng){const d=[C[0]-P[i][0],C[1]-P[i][1]],l=Math.hypot(d[0],d[1]);x=P[i][0]+d[0]/l*60;y=P[i][1]+d[1]/l*60;}else{x=(P[i][0]+P[(i+1)%4][0])/2;y=(P[i][1]+P[(i+1)%4][1])/2;}
   ex+=`<circle cx="${x}" cy="${y}" r="16" fill="#fff" stroke="${GC_COL[j]}" stroke-width="3"/><text x="${x}" y="${y+7}" text-anchor="middle" font-size="20" font-weight="bold" fill="${GC_COL[j]}">${j+1}</text>`;}));
  box.innerHTML=`<svg viewBox="0 0 380 300" class="gc-fig"><polygon points="${ptsStr(P)}" fill="#f7fafc"/>${ex}</svg>`;
  const list=done.map((s,j)=>`<span style="color:${GC_COL[j]}">${j+1} ${unit}</span>`).join('、');
  cnt.innerHTML=k===0?`▶ 開始數${name}……`:list+(k===steps.length?`　→ <u>${sum}</u>`:'');}
 MODES.forEach(M=>{const b=el('button',{class:'btn ghost'},M[0]);b.onclick=()=>{clearInterval(timer);bar.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));let k=0;draw(M,0);timer=setInterval(()=>{k++;draw(M,k);if(k>=M[1].length)clearInterval(timer);},800);};bar.append(b);});
 container.append(bar,box,cnt);draw(MODES[0],0);
}
function gcPairing(container){
 const P=GC_PTS,C=centroid(P),N=['A','B','C','D'];
 const bar=el('div',{class:'btns gc-bar',style:'justify-content:center'}),box=el('div'),cnt=el('div',{class:'gc-cnt'}),fb=el('div',{class:'feedback'});
 let mode='side',sel=[],groups=[];
 const lbl=i=>mode==='side'?'邊 '+N[i]+N[(i+1)%4]:'∠'+N[i];
 const colorOf=i=>{const j=groups.findIndex(g=>g.includes(i));return j>=0?GC_COL[j]:sel.includes(i)?'#ecc94b':null;};
 function render(){let ex=P.map((p,i)=>gcSideLine(P,i,'class="gc-side"')).join('');
  if(mode==='side'){P.forEach((p,i)=>{const c=colorOf(i);if(c)ex+=gcSideLine(P,i,`stroke="${c}" stroke-width="12" stroke-linecap="round"`);});P.forEach((p,i)=>{ex+=gcSideLine(P,i,`class="gc-hit" data-i="${i}"`);});}
  else P.forEach((p,i)=>{ex+=`<path d="${gcSector(P,i,40)}" fill="${colorOf(i)||'#ffd54f'}" fill-opacity=".85" stroke="#975a16" data-i="${i}" style="cursor:pointer"/>`;});
  P.forEach((p,i)=>{const d=[p[0]-C[0],p[1]-C[1]],l=Math.hypot(d[0],d[1]);ex+=`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#2d3748"/><text x="${p[0]+d[0]/l*24}" y="${p[1]+d[1]/l*24+8}" text-anchor="middle" font-size="22" font-weight="bold">${N[i]}</text>`;});
  box.innerHTML=`<svg viewBox="0 0 380 300" class="gc-fig"><polygon points="${ptsStr(P)}" fill="#f7fafc"/>${ex}</svg>`;
  box.querySelectorAll('[data-i]').forEach(e=>e.onclick=()=>choose(+e.dataset.i));
  const unit=mode==='side'?'條邊':'個角',g=mode==='side'?'對邊':'對角';
  cnt.innerHTML=groups.length===2?`🎉 4 ${unit}配成了 <b>2 組${g}</b>（2 組 × 2 ＝ 4 ${unit}）`:`已配成 ${groups.length} 組${g}（＝ ${groups.length*2} ${unit}）　👆 請點選兩${unit}配成一組`;}
 function choose(i){if(groups.some(g=>g.includes(i)))return;const k=sel.indexOf(i);if(k>=0){sel.splice(k,1);render();return;}sel.push(i);
  if(sel.length===2){const [a,b]=sel;
   if((a+2)%4===b){groups.push([a,b]);fb.innerHTML=`<div class="ok">✅ 第 ${groups.length} 組${mode==='side'?'對邊':'對角'}：${lbl(a)} 和 ${lbl(b)}。一組 ＝ 兩${mode==='side'?'條':'個'}！</div>`;}
   else{const v=(a+1)%4===b?b:a;fb.innerHTML=mode==='side'?`<div class="bad">❌ ${lbl(a)} 和 ${lbl(b)} 在頂點 ${N[v]} 相接，是<b>鄰邊</b>，不是一組對邊。對邊要相對、不相接。</div>`:`<div class="bad">❌ ${lbl(a)} 和 ${lbl(b)} 是相鄰的角（共用一條邊），不是一組對角。</div>`;}
   sel=[];}
  render();}
 [['side','配一配：對邊'],['ang','配一配：對角']].forEach(([m,l])=>{const b=el('button',{class:'btn ghost'},l);b.onclick=()=>{mode=m;sel=[];groups=[];fb.innerHTML='';bar.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render();};bar.append(b);});
 const r=el('button',{class:'btn'},'🔄 重設');r.onclick=()=>{sel=[];groups=[];fb.innerHTML='';render();};bar.append(r);
 container.append(bar,box,cnt,fb);bar.children[0].click();
}

function transformLocal(local,rotDeg,flip){return rot(local.map(([x,y])=>flip?[-x,y]:[x,y]),rotDeg);}
class Tangram{
 constructor(container){
  this.S=50;this.Wu=14;this.Hu=8;this.taskIdx=0;this.hint=false;this.sel=null;
  this.pieces=TAN_PIECES.map(p=>{const c=centroid(p.pts);return {...p,local:p.pts.map(q=>[q[0]-c[0],q[1]-c[1]]),home:[c[0]+1,c[1]+2],pos:[c[0]+1,c[1]+2],rot:0,flip:false};});
  const tabs=el('div',{class:'subtabs'});TAN_TASKS.forEach((t,i)=>{const b=el('button',{},`${i+1}. 拼成${t.name}`);b.onclick=()=>{this.setTask(i);tabs.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');};tabs.append(b);});

  const btns=el('div',{class:'btns'});const mk=(l,f,cls='btn ghost')=>{const b=el('button',{class:cls},l);b.onclick=f;btns.append(b);return b;};
  mk('↻ 旋轉 45°',()=>{if(this.sel){this.sel.rot=(this.sel.rot+45)%360;this.render();this.check();}});
  mk('⇋ 翻轉',()=>{if(this.sel){this.sel.flip=!this.sel.flip;this.render();this.check();}});
  mk('💡 提示（顯示拼法虛線）',()=>{this.hint=!this.hint;this.render();});
  mk('👁 顯示答案',()=>this.showAnswer());
  mk('🔄 重設',()=>{this.pieces.forEach(p=>{p.pos=p.home.slice();p.rot=0;p.flip=false;});this.msg.innerHTML='';this.render();});
  this.msg=el('div',{class:'feedback'});
  container.append(tabs,this.info,this.svg,btns,el('p',{class:'tip'},'操作：用手指或滑鼠拖動七巧板的部件到右邊的虛線框內；先點選部件，再按「旋轉」或「翻轉」。拼好會自動檢查。'),this.msg);
  this.svg.addEventListener('pointerdown',e=>this.down(e));this.svg.addEventListener('pointermove',e=>this.move(e));this.svg.addEventListener('pointerup',e=>this.up(e));this.svg.addEventListener('pointercancel',e=>this.up(e));

 }
 get task(){return TAN_TASKS[this.taskIdx];}
 setTask(i){this.taskIdx=i;this.hint=false;this.msg.innerHTML='';this.pieces.forEach(p=>{p.pos=p.home.slice();p.rot=0;p.flip=false;});this.info.innerHTML=`任務 ${i+1}：選擇 <b>${this.task.use.join('、')}</b>，拼成 <b>${this.task.name}</b>，放到右邊的虛線框內。`;this.render();}
 absPts(p){return transformLocal(p.local,p.rot,p.flip).map(q=>[q[0]+p.pos[0],q[1]+p.pos[1]]);}
 toUnits(e){const r=this.svg.getBoundingClientRect();return [(e.clientX-r.left)/r.width*this.Wu,(e.clientY-r.top)/r.height*this.Hu];}
 down(e){const id=e.target.dataset&&e.target.dataset.id;if(!id)return;this.sel=this.pieces.find(p=>p.id===id);const u=this.toUnits(e);this.off=[u[0]-this.sel.pos[0],u[1]-this.sel.pos[1]];this.drag=true;this.svg.setPointerCapture(e.pointerId);this.render();}

 up(e){if(!this.drag)return;this.drag=false;if(this.sel){this.sel.pos=this.sel.pos.map(v=>Math.round(v*4)/4);this.render();this.check();}}
 render(){const t=this.task;let s='';
  for(let x=0;x<=this.Wu;x+=0.5)for(let y=0;y<=this.Hu;y+=0.5)s+=`<circle cx="${x}" cy="${y}" r=".025" fill="#cbd5e0"/>`;
  s+=`<polygon points="${ptsStr(t.outline)}" fill="#edf2f7" stroke="#e53e3e" stroke-width=".06" stroke-dasharray=".2 .12"/>`;
  s+=`<text x="10" y="1.6" text-anchor="middle" font-size=".5" fill="#c53030">把${t.name}拼在這裏（用 ${t.use.join('、')}）</text>`;
  if(this.hint)for(const id in t.sol)s+=`<polygon points="${ptsStr(t.sol[id])}" fill="none" stroke="#805ad5" stroke-width=".05" stroke-dasharray=".15 .1"/><text x="${centroid(t.sol[id])[0]}" y="${centroid(t.sol[id])[1]+.15}" text-anchor="middle" font-size=".4" fill="#805ad5">${id}</text>`;
  s+=`<text x="3" y="0.7" text-anchor="middle" font-size=".45" fill="#4a5568">這是七巧板</text>`;
  const ordered=this.pieces.slice().sort((a,b)=>(a===this.sel)-(b===this.sel));
  ordered.forEach(p=>{const P=this.absPts(p),c=centroid(P);const dim=!t.use.includes(p.id);s+=`<polygon class="piece ${p===this.sel?'sel':''}" data-id="${p.id}" points="${ptsStr(P)}" fill="${p.color}" fill-opacity="${dim?.45:1}"/><text x="${c[0]}" y="${c[1]+.16}" text-anchor="middle" font-size=".45" font-weight="bold" fill="#2d3748" pointer-events="none">${p.id}</text>`;});
  this.svg.innerHTML=s;}
 check(){const t=this.task,polys=t.use.map(id=>this.absPts(this.pieces.find(p=>p.id===id)));
  const all=[t.outline,...polys];const xs=all.flat().map(p=>p[0]),ys=all.flat().map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(x1-x0>7||y1-y0>7)return;
  let inT=0,cov=0,over=0;const st=0.08;for(let x=x0;x<=x1;x+=st)for(let y=y0;y<=y1;y+=st){const it=pip([x,y],t.outline),ip=polys.some(P=>pip([x,y],P));if(it){inT++;if(ip)cov++;}else if(ip)over++;}
  if(cov/inT>0.93&&over/inT<0.07){this.msg.innerHTML=`<div class="ok">🎉 太好了！你用 ${t.use.join('、')} 拼成了 <b>${t.name}</b>！${this.taskIdx<TAN_TASKS.length-1?'試試下一個任務。':'全部任務完成！'}</div>`;}
  else if(cov/inT>0.5){this.msg.innerHTML=`<div class="bad">接近了！還有部分未填滿或超出了框框，試試旋轉、翻轉或移動部件。</div>`;}}
 showAnswer(){const t=this.task;for(const id in t.sol){const p=this.pieces.find(q=>q.id===id);const poly=t.sol[id],c=centroid(poly),tgt=poly.map(q=>[q[0]-c[0],q[1]-c[1]]);let found=false;
   for(const flip of [false,true]){for(let r=0;r<360&&!found;r+=45){const pts=transformLocal(p.local,r,flip);if(tgt.every(tp=>pts.some(q=>Math.hypot(q[0]-tp[0],q[1]-tp[1])<0.03))){p.rot=r;p.flip=flip;p.pos=c;found=true;}}if(found)break;}}
  this.render();this.msg.innerHTML=`<div class="ok">這是其中一種拼法。按「重設」再自己試一次！</div>`;}
}

function itemSVG(it,hint){return `<svg viewBox="0 0 200 160" style="max-width:260px">${it.svg}${hint?`<polygon points="${it.outline}" fill="none" stroke="#ff0066" stroke-width="5" stroke-dasharray="9 6"/>`:''}</svg>`;}
function lifeQuestions(){let s;for(let t=0;t<300;t++){s=shuffle(LIFE_ITEMS);if(s.every((x,i)=>i===0||x.type!==s[i-1].type))break;}
 return s.map((it,i)=>({html:`<p>「${it.name}」的外形像哪種四邊形？${i<2?'<span class="badge">提示：紅色虛線框住了物品的外圍</span>':''}</p>${itemSVG(it,i<2)}`,answer:TYPES[it.type].name,explain:it.why,after:body=>{const svg=body.querySelector('svg');if(svg&&i>=2)svg.insertAdjacentHTML('beforeend',`<polygon points="${it.outline}" fill="none" stroke="#ff0066" stroke-width="5" stroke-dasharray="9 6"/>`);}}));}
function buildLife(){
 const sec=el('section',{class:'tab',id:'tab-life'});sec.innerHTML=`<h2>🏙️ 日常生活中的四邊形</h2><p class="tip">在我們日常生活中，有很多物件的面都是四邊形。先看圖例（紅色虛線是物品的外圍），再做練習。</p><div id="life-gallery"></div><div class="card"><h3>🎮 練習：這件物件像哪種四邊形？</h3><p class="tip">共 ${LIFE_ITEMS.length} 題，隨機次序，第 1–2 題有紅色框提示，之後要自己觀察！</p><div id="life-quiz"></div></div><div class="card"><h3>🏫 課堂活動</h3><p>在課室找出不同的四邊形物件（例如：窗、門、黑板、地磚、書、間尺……），說說它像哪種四邊形，為甚麼？</p><p class="tip">家課：在家中找一件四邊形物件拍照或畫下來，圈出它像（長方形／正方形／梯形／平行四邊形／菱形／鷂形）。</p></div>`;main.append(sec);
 const g=document.getElementById('life-gallery');ORDER.forEach(t=>{const c=el('div',{class:'card'});c.innerHTML=`<h3 style="color:${TYPES[t].color}">${TYPES[t].name}　<span style="font-size:15px;color:#555">${TYPES[t].desc}</span></h3>`;const grid=el('div',{class:'life-grid'});LIFE_ITEMS.filter(x=>x.type===t).forEach(it=>grid.append(el('div',{class:'life-item'},`${itemSVG(it,true)}<div class="nm">${it.name}</div><div class="why">${it.why}</div>`)));c.append(grid);g.append(c);});
 makeQuiz(document.getElementById('life-quiz'),lifeQuestions(),{choices:ORDER.map(t=>TYPES[t].name),regen:lifeQuestions});
}

/* ================= 中國傳統建築的窗櫺 ================= */
const LW=200;let latId=0;
function latWindow(inner,hl='',size=260){const id='lc'+(latId++);return `<svg viewBox="-14 -14 ${LW+28} ${LW+28}" class="win-svg" style="max-width:${size}px"><defs><clipPath id="${id}"><rect x="0" y="0" width="${LW}" height="${LW}"/></clipPath></defs><rect x="-14" y="-14" width="${LW+28}" height="${LW+28}" rx="6" fill="#8b5a2b"/><rect x="0" y="0" width="${LW}" height="${LW}" fill="#fff8e7"/><g clip-path="url(#${id})">${hl}<g fill="none" stroke="#5a3a1a" stroke-width="5" stroke-linecap="square">${inner}</g></g></svg>`;}
const LL=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`;
const LAT={
 zhiling:{name:'直欞窗',shape:'rect',hasN:true,min:3,max:8,def:5,desc:'最古老的窗櫺樣式：一排直立的木條（「欞」），把窗分成一條條狹長的<b>長方形</b>。',meaning:'簡單樸實，常見於古代民居和寺廟。',
  draw(n){let s='';for(let i=1;i<n;i++){const x=LW*i/n;s+=LL(x,0,x,LW);}return s;},
  hl(n){return `<rect x="${LW/n}" y="0" width="${LW/n}" height="${LW}" fill="#f6ad55" fill-opacity=".7"/>`;},
  count(n){return `${n} 個長方形`;}},
 fangge:{name:'方格窗',shape:'square',hasN:true,min:3,max:8,def:4,desc:'橫直木條交織成一格一格的<b>正方形</b>，整齊方正。',meaning:'方格窗簡潔大方，宋代以後十分流行。',
  draw(n){let s='';for(let i=1;i<n;i++){const x=LW*i/n;s+=LL(x,0,x,LW)+LL(0,x,LW,x);}return s;},
  hl(n){const c=LW/n;return `<rect x="${c}" y="${c}" width="${c}" height="${c}" fill="#f6ad55" fill-opacity=".7"/>`;},
  count(n){return `${n} × ${n} ＝ ${n*n} 個正方形`;}},
 xiefang:{name:'斜方格（菱格窗）',shape:'rhombus',hasN:true,min:3,max:7,def:4,desc:'兩組斜放的木條交織，格子是一個個<b>菱形</b>——4 條邊相等，但沒有直角。',meaning:'像菱花一樣美麗；故宮的門窗常用更複雜的「菱花」圖案。',
  draw(n){const r=0.6,d=LW/n,c1m=LW/2+r*LW/2,c2m=LW/2-r*LW/2;let s='';for(let k=-n-3;k<=n+3;k++){const c1=c1m+(k+0.5)*d,c2=c2m+(k+0.5)*d;s+=LL(c1,0,c1-r*LW,LW)+LL(c2,0,c2+r*LW,LW);}return s;},
  hl(n){const r=0.6,d=LW/n,c1m=LW/2+r*LW/2,c2m=LW/2-r*LW/2;const pts=[[c1m-d/2,c2m-d/2],[c1m+d/2,c2m-d/2],[c1m+d/2,c2m+d/2],[c1m-d/2,c2m+d/2]].map(([c1,c2])=>[(c1+c2)/2,(c1-c2)/(2*r)]);return `<polygon points="${ptsStr(pts)}" fill="#f6ad55" fill-opacity=".7"/>`;},
  count(){return '許多個菱形';}},
 bubu:{name:'步步錦',shape:'rect',hasN:false,desc:'長短不同的木條互相垂直相接，一步一步向內收，拼成大小不同的<b>長方形</b>和<b>正方形</b>。',meaning:'「步步錦」寓意步步高升、前程似錦，是明清時期很受歡迎的圖案。',
  draw(){return LL(50,50,150,50)+LL(150,50,150,150)+LL(150,150,50,150)+LL(50,150,50,50)+LL(100,0,100,50)+LL(0,100,50,100)+LL(100,150,100,200)+LL(150,100,200,100)+LL(75,75,125,75)+LL(125,75,125,125)+LL(125,125,75,125)+LL(75,125,75,75)+LL(100,50,100,75)+LL(50,100,75,100)+LL(100,125,100,150)+LL(125,100,150,100);},
  hl(){return `<rect x="100" y="0" width="100" height="50" fill="#f6ad55" fill-opacity=".7"/><rect x="75" y="75" width="50" height="50" fill="#68d391" fill-opacity=".7"/>`;},
  qhl:`<rect x="100" y="0" width="100" height="50" fill="#f6ad55" fill-opacity=".7"/>`,
  count(){return '長方形（橙色）和正方形（綠色）';}},
 bing:{name:'冰裂紋',shape:'general',hasN:false,desc:'像冰塊裂開的紋理，每一塊的形狀都不一樣：有<b>四邊形</b>，也有三角形和五邊形。',meaning:'寓意冰雪消融、春天來臨；也提醒讀書人「十年寒窗」要刻苦。',
  draw(){return LL(0,70,70,60)+LL(70,60,55,0)+LL(70,60,140,90)+LL(140,90,200,40)+LL(140,90,150,170)+LL(150,170,200,185)+LL(150,170,90,150)+LL(90,150,70,60)+LL(90,150,0,165)+LL(90,150,110,200)+LL(150,170,135,200);},
  hl(){return `<polygon points="70,60 140,90 150,170 90,150" fill="#f6ad55" fill-opacity=".7"/>`;},
  qhl:`<polygon points="70,60 140,90 150,170 90,150" fill="#f6ad55" fill-opacity=".7"/>`,
  count(){return '一個「一般四邊形」（橙色）——四條邊、四個角都不相等';}},
 gui:{name:'龜背錦',shape:'none',hasN:false,desc:'像烏龜背上的花紋，格子是<b>六邊形</b>，<b>不是</b>四邊形！',meaning:'龜象徵長壽，所以「龜背錦」寓意健康長壽。',
  hex(row,col){const r=20,h=r*Math.sqrt(3)/2;const cx=col*3*r+(row%2?1.5*r:0),cy=row*h;return [0,1,2,3,4,5].map(k=>{const a=Math.PI/3*k;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];});},
  draw(){let s='';for(let row=-1;row<14;row++)for(let col=-1;col<5;col++)s+=`<polygon points="${ptsStr(this.hex(row,col))}"/>`;return s;},
  hl(){return `<polygon points="${ptsStr(this.hex(5,1))}" fill="#f6ad55" fill-opacity=".7"/>`;},
  count(){return '六邊形——不是四邊形！';}}
};

 const rows=[['只有 1 組對邊平行',['trap']],['2 組對邊平行',['square','rect','para','rhombus']],['2 組對邊長度相等',['rect','para']],['4 邊長度相等',['square','rhombus']],['2 組鄰邊相等',['kite']],['只有 1 組對角相等',['kite']],['2 組對角相等',['para','rhombus']],['4 角相等（都是直角）',['square','rect']]];
 const sec=el('section',{class:'tab',id:'tab-sum'});
 sec.innerHTML=`<h2>📋 分辨不同四邊形的特性</h2><div class="card"><p class="tip">在正確的格內加 ✓（按課本的分法），然後按「檢查」。</p><table class="cmp" id="cmp"><tr><th>特性 ＼ 四邊形</th>${ORDER.map(t=>`<th style="color:${TYPES[t].color}">${svgShape(SHAPES[t].example,TYPES[t].color,60)}<br>${TYPES[t].name}</th>`).join('')}</tr>${rows.map((r,i)=>`<tr><td style="text-align:left">${r[0]}</td>${ORDER.map(t=>`<td><input type="checkbox" data-r="${i}" data-t="${t}"></td>`).join('')}</tr>`).join('')}</table><div class="btns"><button class="btn" id="cmpCheck">檢查</button><button class="btn ghost" id="cmpShow">顯示答案</button></div><div class="feedback" id="cmpRes"></div></div>
 <div class="card"><h3>讀一讀、認一認</h3><div class="grid3">${ORDER.map(t=>`<div class="shape-card">${svgShape(SHAPES[t].example,TYPES[t].color,120)}<div style="font-weight:bold;color:${TYPES[t].color}">${TYPES[t].name}</div><ul style="text-align:left;font-size:15px;margin:4px 0;padding-left:18px">${SHAPES[t].props.map(p=>`<li>${p}</li>`).join('')}</ul></div>`).join('')}</div></div>`;
 main.append(sec);
 const boxes=[...sec.querySelectorAll('input[type=checkbox]')];
 document.getElementById('cmpCheck').onclick=()=>{let wrong=0;boxes.forEach(b=>{const should=rows[+b.dataset.r][1].includes(b.dataset.t);const ok=b.checked===should;b.parentElement.className=ok?'good':'wrong';if(!ok)wrong++;});document.getElementById('cmpRes').innerHTML=wrong?`<div class="bad">有 ${wrong} 格不對（紅色），再想一想！</div>`:'<div class="ok">全部正確！你已經掌握六種四邊形的特性 🏆</div>';};
 document.getElementById('cmpShow').onclick=()=>{boxes.forEach(b=>{b.checked=rows[+b.dataset.r][1].includes(b.dataset.t);b.parentElement.className='';});};
}

/* ================= 啟動 ================= */
const safe=(fn,label)=>{try{fn();}catch(e){console.error('建立「'+label+'」時出錯：',e);}};
safe(buildHome,'首頁');
safe(buildPre,'預習');
safe(buildPreDetail,'預習：對邊／對角／對角線／鄰邊');
safe(buildPairs,'組與條');
ORDER.forEach(t=>safe(()=>buildShapePage(t),TYPES[t].name));
safe(buildCmpSR,'正方形 vs 長方形');
safe(buildCmpSD,'正方形 vs 菱形');
safe(buildGrid,'方格紙畫四邊形');
safe(buildPeg,'釘板製作');
safe(buildTangram,'七巧板');
safe(buildLife,'生活中的四邊形');
safe(buildLattice,'中國傳統窗櫺');
safe(buildKites,'風箏與非遺');
safe(buildSum,'特性比較');
goTab('home');
</script>
