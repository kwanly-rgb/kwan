<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>探索三角形面積公式</title>
<style>
  :root {
    --primary: #00796b;
    --primary-light: #e0f2f1;
    --rect-primary: #00796b;
    --para-primary: #0277bd;
    --trap-primary: #ef6c00;
    
    /* 顏色提示變數系統 */
    --cue-red: #d32f2f;
    --cue-red-light: #ffebee;
    --cue-blue: #1976d2;
    --cue-blue-light: #e3f2fd;
    --cue-green: #2e7d32;
    --cue-green-light: #e8f5e9;
    --cut-purple: #8e24aa;

    --text-main: #263238;
    --success: #2e7d32;
    --error: #c62828;
  }

  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  body { margin: 0; padding: 16px; background: #eceff1; color: var(--text-main); position: relative; }
  .container { max-width: 980px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); position: relative; z-index: 2; }
  
  header { text-align: center; margin-bottom: 18px; }
  header h1 { margin: 0 0 6px 0; font-size: 28px; }
  header h1 a { color: var(--primary); text-decoration: none; border-bottom: 2px transparent solid; transition: border-color 0.2s; }
  header h1 a:hover { border-bottom-color: var(--primary); }
  p.subtitle { margin: 0; font-size: 15px; color: #004d40; font-weight: bold; }

  /* 慶祝動畫專用畫布 */
  #celebrationCanvas {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; display: block;
  }

  /* 頂部三大分頁切換按鈕 */
  .tab-container { display: flex; gap: 10px; margin-bottom: 18px; border-bottom: 3px solid #cfd8dc; padding-bottom: 8px; }
  .tab-button {
    flex: 1; padding: 12px 14px; font-size: 16px; font-weight: bold; border-radius: 12px 12px 0 0; border: none; cursor: pointer;
    transition: all 0.25s; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .tab-rect { background: #e0f2f1; color: #004d40; }
  .tab-para { background: #e1f5fe; color: #01579b; }
  .tab-trap { background: #fff3e0; color: #e65100; }
  .tab-rect.active { background: var(--rect-primary); color: #ffffff; }
  .tab-para.active { background: var(--para-primary); color: #ffffff; }
  .tab-trap.active { background: var(--trap-primary); color: #ffffff; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* 梯形子方法切換器 */
  .method-switcher {
    display: flex; gap: 10px; margin-bottom: 14px; background: #fff8e1; padding: 10px; border-radius: 12px; border: 2px solid #ffe082;
  }
  .method-btn {
    flex: 1; padding: 10px 12px; font-size: 15px; font-weight: bold; border-radius: 8px; border: 2px solid transparent; cursor: pointer; background: #ffffff; color: #5d4037; transition: all 0.2s;
  }
  .method-btn.active {
    background: var(--trap-primary); color: #ffffff; border-color: #bf360c; box-shadow: 0 2px 8px rgba(239, 108, 0, 0.25);
  }

  /* 步驟引導條 */
  .step-bar { display: flex; justify-content: space-between; margin-bottom: 16px; background: #f1f5f9; border-radius: 12px; padding: 8px 16px; gap: 8px; }
  .step-item { flex: 1; text-align: center; font-size: 13px; font-weight: bold; padding: 6px 4px; border-radius: 8px; color: #94a3b8; background: transparent; }
  .step-item.active { background: #ffffff; color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .rect-active { color: var(--rect-primary) !important; }
  .para-active { color: var(--para-primary) !important; }
  .trap-active { color: var(--trap-primary) !important; }

  /* 顏色圖例 */
  .color-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-bottom: 16px; }
  .legend-badge { padding: 6px 14px; border-radius: 30px; font-weight: bold; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .badge-red { background: var(--cue-red-light); color: var(--cue-red); border: 2px solid var(--cue-red); }
  .badge-blue { background: var(--cue-blue-light); color: var(--cue-blue); border: 2px solid var(--cue-blue); }
  .badge-green { background: var(--cue-green-light); color: var(--cue-green); border: 2px solid var(--cue-green); }

  /* 狀態指示牌 */
  .cut-status-box {
    margin-bottom: 12px; padding: 10px 16px; border-radius: 8px; font-size: 15px; font-weight: bold; display: flex; align-items: center; justify-content: space-between;
  }
  .status-diagonal { background: #e8f5e9; border: 2px solid #4caf50; color: #1b5e20; }
  .status-not-diagonal { background: #fff3e0; border: 2px solid #ff9800; color: #e65100; }

  /* 主畫布區 */
  .canvas-wrapper { position: relative; width: 100%; background: #ffffff; border: 2px solid #cfd8dc; border-radius: 12px; overflow: hidden; margin-bottom: 16px; touch-action: none; }
  svg { display: block; width: 100%; height: auto; user-select: none; }

  /* 拖曳手柄 */
  .drag-handle-group { cursor: ew-resize; touch-action: none; }
  .drag-pulse-ring { animation: pulseGlow 1.8s infinite; transform-origin: center; }
  @keyframes pulseGlow {
    0% { r: 9px; opacity: 0.8; }
    50% { r: 16px; opacity: 0.3; }
    100% { r: 9px; opacity: 0.8; }
  }

  /* 控制盤 */
  .control-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; }
  .card-title { font-weight: bold; font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; color: #37474f; }

  .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font-size: 15px; font-weight: bold; padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-cut { background: var(--cut-purple); color: white; }
  .btn-cut:hover { background: #6a1b9a; }
  .btn-overlap { background: #0288d1; color: white; }
  .btn-overlap:hover { background: #01579b; }
  .btn-secondary { background: #eceff1; color: #37474f; border: 1px solid #cfd8dc; }
  .btn-secondary:hover { background: #cfd8dc; }
  .btn-cut:disabled, .btn-overlap:disabled { opacity: 0.5; cursor: not-allowed; }

  /* 輔助線專用按鈕 */
  .btn-toggle-blue { background: var(--cue-blue-light); color: #0d47a1; border: 2px solid var(--cue-blue); }
  .btn-toggle-blue:hover { background: #bbdefb; }
  .btn-toggle-green { background: var(--cue-green-light); color: #1b5e20; border: 2px solid var(--cue-green); }
  .btn-toggle-green:hover { background: #c8e6c9; }
  .btn-toggle-hidden { background: #f1f5f9; color: #64748b; border: 2px dashed #94a3b8; }
  .btn-toggle-hidden:hover { background: #e2e8f0; }

  /* 學生互動練習區 */
  .task-card { border: 2px solid #bbf7d0; border-radius: 14px; padding: 18px; }
  .task-card.rect-task { background: #f0fdf4; border-color: #bbf7d0; }
  .task-card.para-task { background: #f0f9ff; border-color: #bae6fd; }
  .task-card.trap-task { background: #fff8e1; border-color: #ffe082; }
  .task-header { font-size: 17px; font-weight: bold; margin-bottom: 12px; }
  .task-header.rect-th { color: #166534; }
  .task-header.para-th { color: #075985; }
  .task-header.trap-th { color: #e65100; }
